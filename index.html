<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamedex</title>
  <script>try{var t=localStorage.getItem('portfolio-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#view" data-i18n="app.skip"></a>

  <header class="nav">
    <a class="wordmark" href="#/">GAME<span>DEX</span></a>
    <nav class="nav__links" aria-label="" data-i18n-attr="aria-label:nav.label">
      <a class="nav-link" href="#/" data-route="library">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
        <span data-i18n="nav.library"></span>
      </a>
      <a class="nav-link" href="#/import" data-route="import">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg>
        <span data-i18n="nav.import"></span>
      </a>
      <a class="nav-link" href="#/settings" data-route="settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span data-i18n="nav.settings"></span>
      </a>
    </nav>
    <div class="nav__right">
      <div class="seg-toggle"><button type="button" class="cut-a-6 is-chamfered" data-theme-toggle aria-pressed="false"></button></div>
      <div class="lang-toggle" role="group">
        <button type="button" class="cut-a-6 is-chamfered" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" class="cut-a-6 is-chamfered" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div class="shell__inner">
      <section id="filters" class="panel panel--live" hidden aria-label="" data-i18n-attr="aria-label:filters.title"></section>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
